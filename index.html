 const ev=agrupa(e.itens.filter(it=>prod.has(it.marca)),it=>it.marca+'\t'+it.titulo).slice(0,5).map(p=>[p.cols[0],p.cols[1].trim(),p.usos]);
 return {usos:e.usos,unicos:e.unicos,mes:SEM.envio&&SEM.envio.fim?SEM.envio.fim.slice(0,7):undefined,parceiros:parc,eventos:ev}}
function desenharEnvio(){const E=SEM.envio,box=document.getElementById('wprev');if(!box)return;
 if(E.lendo){box.innerHTML='<p class="carregando">Lendo o arquivo…</p>';return}
 const err=[E.erro,E.erroMes].filter(Boolean).map(x=>`<div class="note">${esc(x)}</div>`).join('');
 if(!E.sem){box.innerHTML=err+(E.mes?'<p class="hint">Base do mês lida. Falta a Base da semana.</p>':'');return}
 const e=E.sem,mm=E.mes;const L=SEM.dados.semanas;const sobre=L.filter(s=>!(s.f<E.inicio||s.i>E.fim));
 const top=agrupa(e.itens,it=>it.marca).slice(0,5);const dd=E.fim>=E.inicio?dias(E.inicio,E.fim):0;
 const fimD=dt(E.fim);const mesLab=`${MESN[fimD.getMonth()].toLowerCase()}/${fimD.getFullYear()}`;
 const avisoMes=mm&&mm.usos<e.usos?`<div class="note">A base do mês tem menos usos que a da semana. Confira se é o arquivo do dia 1º até ${pad2(fimD.getDate())}/${pad2(fimD.getMonth()+1)}.</div>`:'';
 box.innerHTML=err+`<div class="card"><h3>Conferir antes de salvar</h3>
 <div class="bar" style="position:static;box-shadow:none;padding:0;border:0;margin:8px 0 14px"><label class="fld"><span>Início (sexta)</span><input type="date" id="wi" value="${E.inicio}"></label><label class="fld"><span>Fim (quinta)</span><input type="date" id="wfim" value="${E.fim}"></label></div>
 ${E.doNome?'':'<div class="note">Não reconheci o período no nome do arquivo. Confira as datas acima.</div>'}
 ${dd!==7?`<div class="note">O período tem ${dd} ${dd===1?'dia':'dias'}; a semana do relatório tem 7 (sexta a quinta).</div>`:''}
 ${sobre.length?`<div class="note">Vai substituir ${sobre.map(s=>`<b>${semLab(s)}</b>${s.so_total?' (contagem antiga)':''}`).join(', ')}.</div>`:''}
 <div class="label" style="margin-top:6px">Semana · ${esc(e.arquivo)}</div>
 <div class="sec" style="margin:8px 0 12px">${KPI('','usos',fmt(e.usos),'')}${KPI('','usuarios-semana',fmt(e.unicos),'','','Usuários únicos')}${KPI('','usos-por-usuario',fmt(e.usos/e.unicos,2),'')}${KPI('','admin-c',fmt(e.admin),'','','Fora: conta de testes')}${KPI('','farmacias',fmt(e.farm),'','','Fora: farmácias')}</div>
 <p class="hint">Top 5 parceiros da semana: ${top.map(p=>`${esc(p.k)} (${fmt(p.usos)})`).join(', ')}.</p>${(()=>{const nv=produtorasNovas(e.itens,mm?mm.itens:[]);return nv.length?`<p class="hint">Produtoras de eventos novas, reconhecidas pelo nome: <b>${nv.map(esc).join(', ')}</b>. Entram no ranking de Eventos ao salvar.</p>`:''})()}
 <div class="label" style="margin-top:14px">Mês até a data · ${mm?esc(mm.arquivo):'não enviada'}</div>
 ${mm?`<div class="sec" style="margin:8px 0 12px">${KPI('','usos',fmt(mm.usos),'','','Total do mês')}${KPI('','usuarios-semana',fmt(mm.unicos),'','','Usuários únicos do mês')}${KPI('','usos-por-usuario',fmt(mm.usos/mm.unicos,2),'')}${KPI('','admin-c',fmt(mm.admin),'','','Fora: conta de testes')}${KPI('','farmacias',fmt(mm.farm),'','','Fora: farmácias')}</div>${avisoMes}
  <p class="hint">Vai para o bloco de <b>${mesLab}</b>. Top 5 parceiros do mês: ${resumoMes(mm).parceiros.map(p=>`${esc(p[0])} (${fmt(p[1])})`).join(', ')}.</p>`
  :`<p class="hint">Sem a base do mês, o bloco do mês fica ${sobre.some(s=>s.i===E.inicio&&s.mtd)?'com o que já estava salvo':'vazio'}. Dá para enviar depois: é só mandar a semana de novo com as duas bases.</p>`}
 <button class="btn" id="wsalvar" type="button">Salvar semana</button> <span class="hint" id="wsmsg"></span></div>`;
 document.getElementById('wi').onchange=x=>{E.inicio=x.target.value;desenharEnvio()};document.getElementById('wfim').onchange=x=>{E.fim=x.target.value;desenharEnvio()};
 document.getElementById('wsalvar').onclick=salvarSemana}
async function salvarSemana(){const E=SEM.envio,e=E.sem,b=document.getElementById('wsalvar'),m=document.getElementById('wsmsg');
 if(!E.inicio||!E.fim||E.fim<E.inicio){m.textContent='Confira as datas.';return}
 b.disabled=true;m.textContent='Salvando…';
 const nv=produtorasNovas(e.itens,E.mes?E.mes.itens:[]);
 if(nv.length){const r=await sb.rpc('salvar_produtoras',{p_lista:[...SEM.prod,...nv]});if(r.error){b.disabled=false;m.textContent='Não salvou: '+r.error.message;return}nv.forEach(x=>SEM.prod.add(x))}
 const {error}=await sb.rpc('salvar_semana',{p:{inicio:E.inicio,fim:E.fim,usos:e.usos,unicos:e.unicos,excluidos:e.admin+e.farm,itens:e.itens,mtd:E.mes?resumoMes(E.mes):null}});
 if(error){b.disabled=false;m.textContent='Não salvou: '+error.message;return}
 delete SEM.itens[E.inicio];const ini=E.inicio;SEM.envio={};await semCarregar(true);SEM.sel=ini;SEM.editando=!!ADMIN;
 location.hash='semanal'}

/* ---------- roteamento da área ---------- */
async function rotaSemanal(h){if(h==='semanal-enviar'&&!ADMIN){location.hash='semanal';return}
 app.innerHTML=shell(h,'<p class="carregando">Carregando…</p>');
 try{await semCarregar()}catch(e){app.innerHTML=shell(h,`<div class="note">Não foi possível carregar o relatório semanal: ${esc(e.message||e)}</div>`);return}
 if((location.hash||'#home').slice(1)!==h)return;
 if(h==='semanal'||h==='semanal-rankings'||h==='semanal-tendencia'){SEM.fcaEd=null;app.innerHTML=semanaPagina(h);bindSemana()}
 else if(h==='semanal-evolucao'){app.innerHTML=evolucaoPagina();renderEvolucao()}
 else if(h==='semanal-enviar'){app.innerHTML=enviarPagina();bindEnviar()}}

/* =====================================================================
   Relatório semanal — Tendência e FCA (fato, causa, ação)
   Projeção do mês, ritmo para superar o mês anterior e o mesmo mês do
   ano anterior, tendência das próximas semanas e FCA automático.
   ===================================================================== */
const TCATS=[['eventos','Eventos'],['lacador','Laçador'],['online','Lojas Online'],['premium','Premium'],['clube','Ações do Clube']];
const sinalP=v=>v==null||!isFinite(v)?'—':`${v>=0?'+':'−'}${fmt(Math.abs(v),1)}%`;
const sinalN=v=>v==null||!isFinite(v)?'—':`${v>=0?'+':'−'}${fmt(Math.abs(v))}`;
const varp=(a,b)=>b?(a/b-1)*100:null;
const nomeMes=(y,m)=>`${MESN[m-1].toLowerCase()}/${y}`;
const mediaA=a=>a.length?a.reduce((t,x)=>t+x,0)/a.length:null;
function semanaLY(i){const alvo=dt(addDias(i,-364));return SEM.dados.semanas.find(x=>Math.abs(dt(x.i)-alvo)<=3*864e5)||null}

/* ---------- projeção do mês ---------- */
function ritmoDe(w){const L=SEM.dados.semanas;const ult=L.slice(Math.max(0,w.k-1),w.k+1);return ult.reduce((t,x)=>t+x.usos,0)/ult.reduce((t,x)=>t+x.dias,0)}
const faixa=d=>d<=10?0:d<=20?1:2;
function margemMes(s,dm){const {y,mi}=mesRef(s);const e=[[],[],[]];
 SEM.dados.semanas.forEach(w=>{if(!w.mtd||w.k>=s.k)return;const r=mesRef(w);if(r.fechado||(r.y===y&&r.mi===mi))return;const fim=plat(r.y,r.mi).usos;if(!fim)return;
  const pj=w.mtd.usos+ritmoDe(w)*(diasNoMes(r.y,r.mi)-r.dm);e[faixa(r.dm)].push(Math.abs(pj/fim-1)*100)});
 const b=e[faixa(dm)],all=e.flat();const v=b.length>=3?b:all;return v.length>=3?{m:mediaA(v),n:v.length}:null}
function projecao(s){const L=SEM.dados.semanas;const {y,mi,dm,fechado}=mesRef(s);const mtd=s.mtd;
 const dmes=diasNoMes(y,mi),rest=fechado?0:dmes-dm;
 const ritmo=ritmoDe(s);
 const pm=mi===1?{y:y-1,m:12}:{y,m:mi-1};
 const refs=[{id:'ant',nome:'Mês anterior',lab:nomeMes(pm.y,pm.m),...plat(pm.y,pm.m)},{id:'ly',nome:`Mesmo mês de ${y-1}`,lab:nomeMes(y-1,mi),...plat(y-1,mi)}]
  .map(r=>({...r,usos:r.usos??null,usuarios:r.usuarios??null}));
 const P={y,mi,dm,dmes,rest,fechado,ritmo,refs,mesLab:nomeMes(y,mi)};
 if(!mtd)return {...P,semMtd:true};
 const U=mtd.usos,N=mtd.unicos;P.U=U;P.N=N;P.ritmoMes=U/dm;
 P.projU=Math.round(U+ritmo*rest);P.projLin=Math.round(U/dm*dmes);P.margem=fechado?null:margemMes(s,dm);const mg=fechado?0:Math.max(.02,(P.margem?P.margem.m:5)/100);
 // usuários únicos: quanto o número do mês costuma crescer a partir deste ponto do mês (histórico das semanas)
 const pares=[];L.forEach(w=>{if(!w.mtd||w.i===s.i)return;const r=mesRef(w);if(r.y===y&&r.mi===mi)return;const fim=plat(r.y,r.mi).usuarios;if(!fim||!w.mtd.unicos)return;pares.push({x:r.dm/diasNoMes(r.y,r.mi),r:fim/w.mtd.unicos})});
 const x0=dm/dmes;const viz=pares.filter(p=>Math.abs(p.x-x0)<=.1).map(p=>p.r).sort((a,b)=>a-b);
 if(fechado){P.projN=N;P.metN='mês fechado'}
 else if(viz.length>=2){P.projN=Math.round(N*viz[Math.floor(viz.length/2)]);P.metN=`curva de ${viz.length} meses`}
 else{const a=refs[0];P.projN=a.usos&&a.usuarios?Math.round(P.projU/(a.usos/a.usuarios)):null;P.metN='frequência do mês anterior'}
 P.refs=refs.map(r=>{if(!r.usos)return r;const faltam=Math.max(0,r.usos-U);const nec=rest?faltam/rest:null;
  return {...r,pctU:P.projU/r.usos*100,gapU:P.projU-r.usos,faltam,nec,acel:nec!=null&&ritmo?(nec/ritmo-1)*100:null,
   pctN:P.projN&&r.usuarios?P.projN/r.usuarios*100:null,gapN:P.projN&&r.usuarios?P.projN-r.usuarios:null,
   st:P.projU>=r.usos*(1+mg)?'ok':P.projU>=r.usos*(1-mg)?'lim':'baixo'}});
 return P}

/* ---------- próximas semanas (sazonalidade do ano anterior) ---------- */
// metade média das últimas 4 semanas, metade essa média ajustada pelo desenho do ano anterior (no teste com 2026 foi o que menos errou)
function projSemana(L,k,j){const base=L.slice(Math.max(0,k-3),k+1);const A=mediaA(base.map(w=>w.usos));const i=addDias(L[k].i,7*j);
 const lyB=base.map(w=>semanaLY(w.i));const ly=semanaLY(i);const Aly=lyB.every(Boolean)?mediaA(lyB.map(w=>w.usos)):null;
 return {i,v:Math.round(Aly&&ly?(A+A*ly.usos/Aly)/2:A),ly:ly?ly.usos:null,saz:!!(Aly&&ly)}}
function proxSemanas(s,n){const L=SEM.dados.semanas;const out=[];let saz=true;
 for(let j=1;j<=n;j++){const p=projSemana(L,s.k,j);saz=saz&&p.saz;const f=addDias(s.f,7*j);const real=L.find(w=>w.i===p.i)||null;out.push({i:p.i,f,lab:semLab({i:p.i,f},true),proj:p.v,ly:p.ly,real:real?real.usos:null})}
 const e=[];for(let k=3;k<s.k;k++)for(let j=1;j<=n&&k+j<=s.k;j++){const p=projSemana(L,k,j);const r=L[k+j];if(r&&r.i===p.i&&r.usos)e.push(Math.abs(p.v/r.usos-1)*100)}
 return {saz,out,erro:e.length>=8?mediaA(e):null}}

/* ---------- FCA automático ---------- */
const ACOES={
 eventos:{down:'Puxar com as produtoras a agenda das próximas semanas e antecipar a divulgação dos próximos eventos (News, push e redes).',up:'Aproveitar a procura: pedir lote extra ou mais cortesias à produtora e manter o evento em destaque enquanto houver ingressos.'},
 lacador:{down:'Revisar as ofertas ativas do Laçador e destacar as de maior uso na News da semana.',up:'Manter em destaque as ofertas que puxaram o Laçador e repetir o formato nas próximas semanas.'},
 online:{down:'Conferir se as ofertas das lojas online foram atualizadas na plataforma (atualização manual) e reforçar na comunicação.',up:'Manter as lojas online em destaque e confirmar até quando a oferta fica ativa.'},
 premium:{down:'Reforçar os benefícios Premium em comunicação segmentada para quem é Premium (CRM).',up:'Usar o benefício que puxou o Premium como argumento de valor do plano (retenção e upgrade).'},
 clube:{down:'Programar a próxima ação de cortesia do Clube: as ações próprias costumam puxar o volume da semana.',up:'Medir quantos usuários novos a ação trouxe e programar a próxima no mesmo formato.'}};
const porChave=(itens,fk)=>{const m=new Map();(itens||[]).forEach(it=>{const k=fk(it);m.set(k,(m.get(k)||0)+it.usos)});return m};
const filtroCat={eventos:it=>SEM.prod.has(it.marca),lacador:it=>it.marca===LACADOR,online:it=>ONLINE.includes(it.marca),premium:it=>it.premium,clube:it=>it.marca===CLUBE_MARCA};
function diffs(cur,prev,fk){const a=porChave(cur,fk),b=porChave(prev,fk);const ks=new Set([...a.keys(),...b.keys()]);
 return [...ks].map(k=>({k,cur:a.get(k)||0,prev:b.get(k)||0,d:(a.get(k)||0)-(b.get(k)||0)}))}
const nomeT=k=>{const [m,t]=k.split('\t');const mm=m===CLUBE_MARCA?'Clube':m;return t&&t.trim()!==m?`${t.trim()} (${mm})`:nomeParc(m)};
function causaItens(cur,prev,fk,sentido){const d=diffs(cur,prev,fk).filter(x=>sentido<0?x.d<0:x.d>0).sort((a,b)=>sentido<0?a.d-b.d:b.d-a.d).slice(0,3);
 return d.map(x=>`${nomeT(x.k)} ${sinalN(x.d)}${sentido<0&&x.cur===0&&x.prev>=15?' (sem usos na semana: provável fim da oferta)':''}${sentido>0&&x.prev===0&&x.cur>=15?' (nova)':''}`)}
function gerarFCA(s,P){const L=SEM.dados.semanas;const p=L[s.k-1];const it=SEM.itens[s.i];const ip=p&&!p.so_total?SEM.itens[p.i]:null;const ly=semanaLY(s.i);
 const ant=L.slice(Math.max(0,s.k-4),s.k).filter(w=>!w.so_total&&SEM.itens[w.i]);const rows=[];
 // 1. semana
 const dv=p?varp(s.usos,p.usos):null,dly=ly?varp(s.usos,ly.usos):null;
 let causa='Semana anterior sem detalhamento por parceiro (contagem antiga).',acao='Acompanhar a próxima semana, já com o detalhamento.';
 if(it&&ip){const sent=s.usos>=p.usos?1:-1;const c=causaItens(it,ip,x=>x.marca,sent);const c2=causaItens(it,ip,x=>x.marca,-sent).slice(0,2);
  causa=c.length?`${sent<0?'Maiores quedas':'Maiores altas'} por parceiro:\n- ${c.join('\n- ')}${c2.length?`\nEm sentido contrário:\n- ${c2.join('\n- ')}`:''}`:'Variação espalhada, sem um parceiro dominante.';
  const top=diffs(it,ip,x=>x.marca+'\t'+x.titulo).sort((a,b)=>sent<0?a.d-b.d:b.d-a.d)[0];
  acao=sent<0?(top&&top.cur===0&&top.prev>=15?`Buscar substituto para **${nomeT(top.k)}**, que saiu do ar, ou negociar a renovação; destacar parceiros equivalentes na próxima News.`:`Colocar em destaque na próxima semana os parceiros que mais caíram ou substitutos equivalentes${top?` (começando por **${nomeParc(top.k.split('\t')[0])}**)`:''}.`)
   :(top?`Entender o que puxou **${nomeT(top.k)}** e repetir o formato; manter em destaque enquanto a oferta estiver ativa.`:'Manter os destaques da semana.')}
 rows.push({f:`**${fmt(s.usos)} usos** e **${fmt(s.unicos)} usuários únicos** na semana: ${sinalP(dv)} vs semana anterior${dly!=null?` e ${sinalP(dly)} vs mesma semana de ${dt(ly.i).getFullYear()}`:''}.`,c:causa,a:acao});
 // 2. mês
 if(!P.semMtd){const r=P.refs.filter(x=>x.usos);const abaixo=r.filter(x=>x.st!=='ok');
  const fato=`${P.fechado?'Resultado':'Projeção'} de **${fmt(P.projU)} usos** em ${P.mesLab}: ${r.map(x=>`${fmt(x.pctU,1)}% de ${x.lab} (${sinalN(x.gapU)})`).join(' e ')}.`;
  const ritmoTxt=`- Ritmo das últimas 2 semanas: ${fmt(P.ritmo)} usos/dia\n- No mês até agora: ${fmt(P.ritmoMes)} usos/dia`;
  let cat='';if(it&&ant.length){const cs=categorias(it);const cm=TCATS.map(([k,n])=>({n,d:varp(cs[k],mediaA(ant.map(w=>categorias(SEM.itens[w.i])[k])))})).filter(x=>x.d!=null&&isFinite(x.d)).sort((a,b)=>a.d-b.d);
   const neg=cm.filter(x=>x.d<-10).slice(0,2);if(neg.length)cat=`\nCategorias abaixo da média das últimas semanas:\n- ${neg.map(x=>`${x.n} (${sinalP(x.d)})`).join('\n- ')}`}
  const alvo=abaixo.sort((a,b)=>b.usos-a.usos)[0];
  rows.push({f:fato,c:`${ritmoTxt}${cat}`,a:P.fechado?'Mês fechado: usar o resultado como base do planejamento do próximo mês.':alvo?`Para superar ${alvo.lab} faltam **${fmt(alvo.faltam)} usos**: **${fmt(alvo.nec)} por dia** nos ${P.rest} dias restantes (${sinalP(alvo.acel)} sobre o ritmo atual). Concentrar a comunicação nos parceiros de maior uso e programar uma ação de cortesia.`:`Manter o ritmo: com ${fmt(P.ritmo)} usos/dia o mês fecha acima das duas referências.`})}
 // 3. categorias que mais se moveram
 if(it&&ant.length){const cs=categorias(it);const base=ant.map(w=>({w,c:categorias(SEM.itens[w.i])}));
  const mov=TCATS.map(([k,n])=>{const b=mediaA(base.map(x=>x.c[k]));return {k,n,cur:cs[k],b,d:varp(cs[k],b),abs:cs[k]-b}}).filter(x=>x.d!=null&&isFinite(x.d)&&Math.abs(x.d)>=20&&Math.abs(x.abs)>=40).sort((a,b)=>Math.abs(b.abs)-Math.abs(a.abs)).slice(0,3);
  mov.forEach(x=>{const sent=x.abs>=0?1:-1;const ref=ip||SEM.itens[ant[ant.length-1].i];
   const c=causaItens(it.filter(filtroCat[x.k]),(ref||[]).filter(filtroCat[x.k]),y=>y.marca+'\t'+y.titulo,sent);
   rows.push({f:`**${x.n}: ${fmt(x.cur)} usos**, ${sinalP(x.d)} vs média das ${ant.length} semanas anteriores (${fmt(x.b)}).`,c:c.length?`${sent<0?'Caíram':'Subiram'} vs semana anterior:\n- ${c.join('\n- ')}`:'Variação espalhada entre as ofertas da categoria.',a:ACOES[x.k][sent<0?'down':'up']})})}
 // 4. concentração
 if(it){const R=rankings(it).parceiros;const t=R[0];if(t&&t.usos/s.usos>=.2)rows.push({f:`**${nomeParc(t.k)}** concentrou **${fmt(100*t.usos/s.usos,1)}%** dos usos da semana.`,c:`Um parceiro responde por 1 em cada ${fmt(s.usos/t.usos,0)} usos: o resultado da semana depende muito dele.`,a:`Diversificar os destaques da comunicação (News, push, home) para reduzir a dependência de ${nomeParc(t.k)}.`})}
 // 5. frequência
 if(p&&p.upu&&s.upu){const d=varp(s.upu,p.upu);if(Math.abs(d)>=8)rows.push({f:`Cada usuário gerou **${fmt(s.upu,2)} vouchers** na semana (${sinalP(d)} vs semana anterior).`,c:`Usos ${sinalP(varp(s.usos,p.usos))} e usuários únicos ${sinalP(varp(s.unicos,p.unicos))}: ${d<0?'menos repetição de uso por pessoa':'mais uso repetido por pessoa (ofertas de uso recorrente)'}.`,a:d<0?'Estimular a recorrência: comunicar novos benefícios a quem usou nas últimas semanas (CRM pós-uso).':'Identificar as ofertas de uso repetido da semana e mantê-las em destaque.'})}
 return rows}

/* texto com linhas "- " vira lista */
function blocoHtml(t){const out=[];let ul=[];const fecha=()=>{if(ul.length){out.push(`<ul>${ul.join('')}</ul>`);ul=[]}};
 String(t||'').split('\n').forEach(l=>{const m=l.match(/^\s*[-•*]\s+(.*)$/);if(m)ul.push(`<li>${richHtml(m[1])}</li>`);else if(l.trim()){fecha();out.push(`<p>${richHtml(l.trim())}</p>`)}});fecha();return out.join('')}
/* ---------- gráfico das semanas ---------- */
function tendChart(hist,prox){const pts=[...hist.map(w=>({lab:w.lab,v:w.usos,ly:w.ly,proj:null})),...prox.out.map(w=>({lab:w.lab,v:w.real,ly:w.ly,proj:w.proj}))];
 const W=1100,H=250,Lm=46,R=14,T0=16,B=34;const all=pts.flatMap(p=>[p.v,p.ly,p.proj]).filter(v=>v!=null);const mx=Math.max(...all)*1.1,mn=Math.min(...all)*.85;
 const x=j=>Lm+j*(W-Lm-R)/(pts.length-1),y=v=>T0+(1-(v-mn)/(mx-mn))*(H-T0-B);
 let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${Lm}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${Lm-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`}
 const h=hist.length-1;g+=`<rect x="${x(h)}" y="${T0}" width="${x(pts.length-1)-x(h)}" height="${H-T0-B}" fill="#C65911" opacity=".06"/><text x="${x(pts.length-1)}" y="${T0-4}" text-anchor="end" font-size="11" fill="#C65911">projeção</text>`;
 const path=(f)=>{let d='',up=false;pts.forEach((p,j)=>{const v=f(p,j);if(v==null){up=false;return}d+=`${up?'L':'M'}${x(j).toFixed(1)} ${y(v).toFixed(1)}`;up=true});return d};
 g+=`<path d="${path(p=>p.ly)}" fill="none" stroke="#c9b3bf" stroke-width="2" stroke-dasharray="3 4"/>`;
 g+=`<path d="${path((p,j)=>j===h?p.v:p.proj)}" fill="none" stroke="#C65911" stroke-width="2.4" stroke-dasharray="6 4"/>`;
 g+=`<path d="${path(p=>p.v)}" fill="none" stroke="#721a50" stroke-width="2.6"/>`;
 pts.forEach((p,j)=>{if(p.v!=null)g+=`<circle cx="${x(j)}" cy="${y(p.v)}" r="3" fill="#721a50"><title>${p.lab}: ${fmt(p.v)}</title></circle>`;if(p.proj!=null)g+=`<circle cx="${x(j)}" cy="${y(p.proj)}" r="3.5" fill="var(--surface)" stroke="#C65911" stroke-width="2"><title>${p.lab}: projeção ${fmt(p.proj)}</title></circle><text x="${x(j)}" y="${y(p.proj)-9}" text-anchor="middle" font-size="11" font-weight="700" fill="#C65911">${fmt(p.proj)}</text>`;
  if(j%2===0||j>=h)g+=`<text x="${x(j)}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${p.lab.split(' a ')[0].replace(/\/.*/,'')}${p.lab.includes('/')?'/'+p.lab.split('/').pop():''}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" class="td-svg" role="img" aria-label="Usos por semana e projeção">${g}</svg>`}

/* ---------- página ---------- */
const stTxt={ok:'deve superar',lim:'no limite de',baixo:'abaixo de'};
function renderTendencia(box,s){const P=projecao(s);const L=SEM.dados.semanas;const prox=proxSemanas(s,3);
 const hist=L.slice(Math.max(0,s.k-7),s.k+1).map(w=>({lab:semLab(w,true),usos:w.usos,ly:semanaLY(w.i)?.usos??null}));
 const auto=gerarFCA(s,P);const salvo=s.fca&&s.fca.rows;const rows=SEM.fcaEd||(salvo?s.fca.rows:auto);
 const r=(P.refs||[]).filter(x=>x.pctU!=null);
 const nOk=r.filter(x=>x.st==='ok').length;const cls=P.semMtd?'neutro':nOk===r.length?'ok':nOk?'lim':'baixo';
 const status=P.semMtd?`Sem a base do mês desta semana: a projeção de ${P.mesLab} aparece quando a semana for enviada com a base do mês.`
  :P.fechado?`${MESN[P.mi-1]} já fechou nesta semana: ${r.map(x=>`${fmt(x.pctU,1)}% de ${x.lab}`).join(' e ')}.`
  :`No ritmo das últimas 2 semanas, ${P.mesLab} fecha com <b>${fmt(P.projU)} usos</b>: ${r.map(x=>`<b>${stTxt[x.st]}</b> ${x.lab} (${sinalN(x.gapU)})`).join(' e ')}.`;
 const k=(lbl,val,sub,c)=>`<div class="td-k ${c||''}"><span>${lbl}</span><b>${val}</b><small>${sub||''}</small></div>`;
 const kp=P.semMtd?'':[
  k(`Usos no mês até ${pad2(P.dm)}/${pad2(P.mi)}`,fmt(P.U),`${fmt(P.ritmoMes)} por dia`),
  k(P.fechado?'Resultado do mês':'Projeção de fechamento',fmt(P.projU),P.fechado?'mês fechado':`faltam ${P.rest} dias${P.margem?` · margem ±${fmt(P.margem.m,0)}%`:''}`,'pr'),
  ...r.map(x=>k(`${P.fechado?'Resultado':'Projeção'} vs ${x.lab}`,`${fmt(x.pctU,1)}%`,`${sinalN(x.gapU)} usos`,x.st)),
  k(P.fechado?'Usuários únicos do mês':'Usuários únicos projetados',fmt(P.projN),r.filter(x=>x.pctN!=null).map(x=>`${sinalP(x.pctN-100)} vs ${x.lab}`).join(' · '))].join('');
 const ritmo=P.semMtd||P.fechado?'':`<div class="card td-card"><h3>${T('ritmo-necessario','Ritmo para superar')}</h3>
  <div class="tw"><table class="cmp td-t"><thead><tr><th></th>${r.map(x=>`<th class="n">${esc(x.nome)}<br><small>${x.lab}</small></th>`).join('')}</tr></thead><tbody>
  <tr><td>Usos da referência</td>${r.map(x=>`<td class="n">${fmt(x.usos)}</td>`).join('')}</tr>
  <tr><td>Usos que faltam</td>${r.map(x=>`<td class="n">${x.faltam?fmt(x.faltam):'<span class="up">já superou</span>'}</td>`).join('')}</tr>
  <tr><td>Dias restantes</td>${r.map(()=>`<td class="n">${P.rest}</td>`).join('')}</tr>
  <tr><td>Média necessária por dia</td>${r.map(x=>`<td class="n"><b>${x.faltam?fmt(x.nec):'—'}</b></td>`).join('')}</tr>
  <tr><td>Ritmo atual por dia (últimas 2 semanas)</td>${r.map(()=>`<td class="n">${fmt(P.ritmo)}</td>`).join('')}</tr>
  <tr><td>Aceleração necessária sobre o ritmo atual</td>${r.map(x=>`<td class="n ${x.faltam&&x.acel>0?'down':'up'}">${!x.faltam?'—':x.acel>0?sinalP(x.acel):`folga de ${fmt(-x.acel,1)}%`}</td>`).join('')}</tr>
  <tr><td>Usuários únicos: referência</td>${r.map(x=>`<td class="n">${fmt(x.usuarios)}</td>`).join('')}</tr>
  <tr><td>Usuários únicos: projeção</td>${r.map(x=>`<td class="n ${x.gapN>=0?'up':'down'}">${fmt(P.projN)} (${sinalN(x.gapN)})</td>`).join('')}</tr>
  </tbody></table></div></div>`;
 const tend=`<div class="card td-card"><h3>${T('tendencia-semanas','Próximas semanas')}</h3>
  ${tendChart(hist,prox)}${legend([['#721a50','Usos por semana'],['#C65911','Projeção'],['#c9b3bf','Mesma semana do ano anterior']])}${prox.erro?`<p class="hint">O uso semanal oscila muito com eventos e ações: nas semanas anteriores, esta projeção errou em média ${fmt(prox.erro,0)}% por semana. Leia como tendência, não como número exato.</p>`:''}
  <div class="tw"><table class="cmp td-t"><thead><tr><th>Semana</th><th class="n">Projeção</th><th class="n">Mesma semana ${P.y-1}</th><th class="n">vs ano anterior</th>${prox.out.some(w=>w.real!=null)?'<th class="n">Realizado</th>':''}</tr></thead><tbody>
  ${prox.out.map(w=>`<tr><td>${w.lab}</td><td class="n"><b>${fmt(w.proj)}</b></td><td class="n">${fmt(w.ly)}</td><td class="n">${w.ly?delta(w.proj,w.ly):'—'}</td>${prox.out.some(z=>z.real!=null)?`<td class="n">${fmt(w.real)}</td>`:''}</tr>`).join('')}</tbody></table></div></div>`;
 const ed=SEM.fcaEd!=null;
 const fca=`<div class="card td-card td-fca"><div class="row-head"><div><h3>${T('fca','FCA da semana')}</h3><p class="sub">${ed?'Edite fato, causa e ação. Use **texto** para negrito; comece a linha com - para virar tópico.':salvo?'Versão revisada pelo time.':'Gerado automaticamente a partir dos números da semana. Revise as ações antes de compartilhar.'}</p></div>
  ${ADMIN?`<div class="acoes">${ed?`<button class="btn" id="fca-ok" type="button">Salvar FCA</button><button class="chip" id="fca-add" type="button">Adicionar linha</button><button class="chip" id="fca-x" type="button">Cancelar</button>`:`<button class="chip" id="fca-ed" type="button">Editar FCA</button>${salvo?'<button class="chip" id="fca-auto" type="button">Voltar ao automático</button>':''}`}<span class="hint" id="fca-msg"></span></div>`:''}</div>
  <div class="tw"><table class="cmp td-fcat"><thead><tr><th>Fato</th><th>Causa</th><th>Ação</th>${ed?'<th></th>':''}</tr></thead><tbody>
  ${rows.map((x,j)=>ed?`<tr data-j="${j}"><td><textarea data-c="f" rows="4">${esc(x.f)}</textarea></td><td><textarea data-c="c" rows="6">${esc(x.c)}</textarea></td><td><textarea data-c="a" rows="4">${esc(x.a)}</textarea></td><td><button class="chip" data-del="${j}" type="button" title="Remover linha">×</button></td></tr>`
   :`<tr><td>${blocoHtml(x.f)}</td><td>${blocoHtml(x.c)}</td><td class="td-acao">${blocoHtml(x.a)}</td></tr>`).join('')||'<tr><td colspan="3" class="hint">Sem dados suficientes para o FCA desta semana.</td></tr>'}</tbody></table></div></div>`;
 const metodo=`<p class="hint">Como calculamos: a projeção soma os usos do mês até a data (base do mês) com o ritmo diário das últimas 2 semanas nos dias que faltam${P.projLin?` (no ritmo médio do mês, seria ${fmt(P.projLin)})`:''}. ${P.margem?`Nas semanas anteriores, a projeção feita nesta altura do mês errou em média ${fmt(P.margem.m,1)}% (${P.margem.n} projeções testadas contra o mês fechado). `:''}Usuários únicos não crescem em linha reta, porque quem já usou no mês não conta de novo: a projeção usa quanto o número de usuários costumou crescer a partir do mesmo ponto do mês (${P.metN||'—'}). As próximas semanas combinam a média das últimas 4 semanas com o desenho das mesmas semanas do ano anterior${prox.saz?'':' (sem o ano anterior completo, ficou só a média)'}. Referências: números do mês da plataforma (Enviar semana › Números do mês).${s.mtd?.antiga?' O mês até a data desta semana veio do relatório original (contava todas as linhas).':''}</p>`;
 box.innerHTML=`<div class="td-status td-${cls}"><span>Status de ${P.mesLab}</span><p>${status}</p></div>
 ${kp?`<div class="td-kpis">${kp}</div>`:''}
 <div class="td-grid">${ritmo}${tend}</div>${fca}${metodo}`;
 const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
 const ler=()=>[...box.querySelectorAll('tr[data-j]')].map(tr=>{const o={};tr.querySelectorAll('textarea').forEach(t=>o[t.dataset.c]=t.value.trim());return o}).filter(o=>o.f||o.c||o.a);
 on('fca-ed',()=>{SEM.fcaEd=rows.map(x=>({...x}));renderTendencia(box,s)});
 on('fca-x',()=>{SEM.fcaEd=null;renderTendencia(box,s)});
 on('fca-add',()=>{SEM.fcaEd=ler();SEM.fcaEd.push({f:'',c:'',a:''});renderTendencia(box,s)});
 box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const v=ler();v.splice(+b.dataset.del,1);SEM.fcaEd=v;renderTendencia(box,s)});
 const salvar=async v=>{const m=document.getElementById('fca-msg');m.textContent='Salvando…';const {error}=await sb.rpc('salvar_fca',{p_inicio:s.i,p:v});
  if(error){m.textContent='Não salvou: '+error.message;return}s.fca=v;SEM.fcaEd=null;renderTendencia(box,s)};
 on('fca-ok',()=>salvar({rows:ler(),em:new Date().toISOString()}));
 on('fca-auto',()=>{if(confirm('Descartar a versão revisada e voltar ao FCA automático?'))salvar(null)})}

/* =====================================================================
   Parceiros — uso por parceiro e por categoria (como no site do Clube)
   Fonte: vouchers por marca de cada mês (Clube em números) + cadastro
   de parceiros (Lista de Parceiros) + ajustes manuais.
   ===================================================================== */
const PA={d:null,a:null,b:null,cat:null,tipo:'',loc:'',q:'',ord:'v',sel:null,grupo:'risco',pend:{}};
const nk=s=>semAcento(String(s||'')).toLowerCase().replace(/[^a-z0-9]/g,'');
const baseNome=s=>String(s||'').split(/\s[|–-]\s/)[0].trim();
const CAT_FIX={'para seu pet':'Para seu Pet','bem-estar':'Saúde e Beleza','bem estar':'Saúde e Beleza'};
const catsDe=s=>String(s||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(x=>CAT_FIX[x.toLowerCase()]||x);
const AGREG=new Set(['Proxy Media','Hubconn','SponsorB','Integrada Comunicação e Marketing']);
const TIPOS=['Parceiros diretos','Eventos e shows','Ações do Clube','Laçador de Ofertas','Agregadores online'];
const SERRA=['caxias','gramado','canela','bento','farroupilha','nova petropolis','garibaldi','cambara','sao francisco de paula','flores da cunha','vacaria'];
const METRO=['porto alegre','canoas','esteio','gravatai','cachoeirinha','viamao','sao leopoldo','novo hamburgo','guaiba','alvorada','sapucaia'];
function grupoLocal(l){const t=semAcento(String(l||'')).toLowerCase().trim();if(!t)return 'Não informado';
 if(t==='online')return 'Online';if(/^(todas|varias)/.test(t))return 'Várias cidades';
 const cs=t.split(/[,;]/).map(x=>x.trim()).filter(Boolean);if(cs.length>2)return 'Várias cidades';
 if(/santa catarina|uruguai|tubarao|camboriu/.test(t))return 'Fora do RS';
 const g=c=>METRO.some(x=>c.includes(x))?'Porto Alegre e região':SERRA.some(x=>c.includes(x))?'Serra':'Interior do RS';
 const gs=[...new Set(cs.map(g))];return gs.length>1?'Várias cidades':gs[0]}
const moda=a=>{const m=new Map();a.filter(Boolean).forEach(x=>m.set(x,(m.get(x)||0)+1));return [...m].sort((x,y)=>y[1]-x[1])[0]?.[0]||''};

/* ---------- dados ---------- */
async function paCarregar(forcar){if(PA.d&&!forcar)return;const {data,error}=await sb.rpc('dados_parceiros');if(error)throw error;
 const D={meses:[...new Set(data.meses.map(r=>r[0]))].sort(),uso:new Map(),cad:data.cadastro||[],aj:new Map((data.ajustes||[]).map(a=>[a.marca,a])),prod:new Set(data.produtoras||[])};
 data.meses.forEach(([m,marca,v,p])=>{marca=conserta(marca);let u=D.uso.get(marca);if(!u){u={};D.uso.set(marca,u)}const x=u[m]||(u[m]={v:0,p:0});x.v+=v;x.p+=p});
 D.idx=new Map();D.cad.forEach(c=>{[nk(c.parceiro),nk(baseNome(c.parceiro))].forEach(k=>{if(!k)return;const l=D.idx.get(k)||[];if(!l.includes(c))l.push(c);D.idx.set(k,l)})});
 D.info=new Map();[...D.uso.keys()].forEach(m=>D.info.set(m,infoMarca(D,m)));
 D.cats=[...new Set(D.cad.flatMap(c=>catsDe(c.categoria)))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 PA.d=D;const ult=D.meses[D.meses.length-1];if(!PA.b||!D.meses.includes(PA.b)){PA.b=ult;PA.a=ult}}
function cadDe(D,m){const aj=D.aj.get(m);if(aj&&aj.parceiro){const l=D.idx.get(nk(aj.parceiro))||D.idx.get(nk(baseNome(aj.parceiro)));if(l)return l}
 const k=nk(m),kb=nk(baseNome(m));let l=D.idx.get(k)||D.idx.get(kb);if(l)return l;
 if(k.length>=5){const ks=[...D.idx.keys()].filter(x=>x.length>=5&&(x.startsWith(k)||k.startsWith(x)));if(ks.length===1)return D.idx.get(ks[0])}
 return []}
function infoMarca(D,m){const aj=D.aj.get(m)||{};const rows=cadDe(D,m);
 const tipo=m===CLUBE_MARCA?'Ações do Clube':m===LACADOR?'Laçador de Ofertas':AGREG.has(m)?'Agregadores online':(D.prod.has(m)||(!rows.length&&PROD_RE.test(semAcento(m))))&&!aj.categoria?'Eventos e shows':'Parceiros diretos';
 let cat,sub;
 if(aj.categoria){cat=aj.categoria;sub=aj.subcategoria||''}
 else if(tipo==='Ações do Clube'){cat='Ações do Clube';sub=''}
 else if(tipo==='Laçador de Ofertas'){cat='Laçador (vários)';sub=''}
 else if(tipo==='Agregadores online'){cat='Lojas online (vários)';sub=''}
 else if(tipo==='Eventos e shows'){cat='Agenda cultural';sub=''}
 else if(rows.length){cat=moda(rows.map(r=>catsDe(r.categoria)[0]))||'Sem categoria no cadastro';sub=moda(rows.filter(r=>catsDe(r.categoria)[0]===cat).map(r=>catsDe(r.subcategoria)[0]))}
 else{cat='Sem cadastro';sub=''}
 const ativo=rows.some(r=>r.status==='Ativo');
 return {m,tipo,cat,sub,rows,cad:rows.length>0,local:rows.length?grupoLocal(moda(rows.map(r=>r.local))):tipo==='Agregadores online'?'Online':'Não informado',localTxt:moda(rows.map(r=>r.local)),
  modo:moda(rows.map(r=>r.modo)),premium:rows.some(r=>r.premium),status:rows.length?(ativo?'Ativo':'Encerrado ou pausado'):'—',ajuste:!!(aj.categoria||aj.parceiro)}}

/* ---------- período ---------- */
const mAdd=(m,n)=>{let [y,mm]=m.split('-').map(Number);mm+=n;while(mm<1){mm+=12;y--}while(mm>12){mm-=12;y++}return `${y}-${pad2(mm)}`};
const mesesEntre=(a,b)=>{const o=[];for(let m=a;m<=b;m=mAdd(m,1))o.push(m);return o};
const perLab=(a,b)=>a===b?lab(a):`${lab(a)} a ${lab(b)}`;
function periodos(){const a=PA.a,b=PA.b;const n=mesesEntre(a,b).length;const pb=mAdd(a,-1),pa=mAdd(a,-n);return {a,b,n,ant:{a:pa,b:pb},ly:{a:mAdd(a,-12),b:mAdd(b,-12)}}}
function somaMarca(m,a,b){const u=PA.d.uso.get(m)||{};let v=0,p=0,n=0;for(const k in u)if(k>=a&&k<=b){v+=u[k].v;p+=u[k].p;n++}return {v,p,n}}
const temDados=(a,b)=>PA.d.meses.some(m=>m>=a&&m<=b);
function linhas(){const P=periodos();const okA=temDados(P.ant.a,P.ant.b),okL=temDados(P.ly.a,P.ly.b);
 return [...PA.d.info.values()].map(i=>{const c=somaMarca(i.m,P.a,P.b),an=somaMarca(i.m,P.ant.a,P.ant.b),ly=somaMarca(i.m,P.ly.a,P.ly.b);
  const prim=Object.keys(PA.d.uso.get(i.m)||{}).filter(k=>PA.d.uso.get(i.m)[k].v>0).sort()[0];
  return {...i,v:c.v,p:c.p,pm:c.p/P.n,vant:okA?an.v:null,vly:okL?ly.v:null,dA:okA&&an.v?varp(c.v,an.v):null,dL:okL&&ly.v?varp(c.v,ly.v):null,prim}})}
function filtra(L){return L.filter(r=>(!PA.tipo||r.tipo===PA.tipo)&&(!PA.cat||r.cat===PA.cat)&&(!PA.loc||r.local===PA.loc)&&(!PA.q||nk(r.m).includes(nk(PA.q))))}

/* ---------- barra de filtros (período + atalhos) ---------- */
const PA_RAP=[['mes','Só o mês'],['ano','Ano até o mês'],['3','Últimos 3 meses'],['12','Últimos 12 meses']];
function paRap(k){const b=PA.b;if(k==='mes')return b;if(k==='ano')return b.slice(0,4)+'-01'<PA.d.meses[0]?PA.d.meses[0]:b.slice(0,4)+'-01';const a=mAdd(b,-(+k-1));return a<PA.d.meses[0]?PA.d.meses[0]:a}
function paOpts(v){return [...PA.d.meses].reverse().map(m=>`<option value="${m}" ${m===v?'selected':''}>${lab(m)}</option>`).join('')}
function paBar(extra){return `<div class="bar"><div class="fld"><span>Período</span><div class="pair"><select id="pa-a">${paOpts(PA.a)}</select><em>até</em><select id="pa-b">${paOpts(PA.b)}</select></div></div><div class="fld"><span>Atalhos</span><div class="chips">${PA_RAP.map(([k,n])=>`<button class="chip ${paRap(k)===PA.a?'on':''}" data-pr="${k}" type="button">${n}</button>`).join('')}</div></div>${extra||''}</div>`}
function paBind(rerender){const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onchange=()=>f(el.value)};
 on('pa-a',v=>{PA.a=v;if(PA.a>PA.b)[PA.a,PA.b]=[PA.b,PA.a];rerender()});on('pa-b',v=>{PA.b=v;if(PA.a>PA.b)[PA.a,PA.b]=[PA.b,PA.a];rerender()});
 document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{PA.a=paRap(b.dataset.pr);rerender()});
 on('pa-tipo',v=>{PA.tipo=v;rerender()});on('pa-cat',v=>{PA.cat=v;rerender()});on('pa-loc',v=>{PA.loc=v;rerender()});
 const q=document.getElementById('pa-q');if(q){q.oninput=()=>{PA.q=q.value;clearTimeout(PA.tq);PA.tq=setTimeout(()=>{const f=document.activeElement===q;rerender();const n=document.getElementById('pa-q');if(f&&n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)}}
 document.querySelectorAll('[data-ficha]').forEach(a=>a.onclick=e=>{e.preventDefault();PA.sel=a.dataset.ficha;location.hash='parceiros-ficha'})}
const selF=(id,val,opts,todos)=>`<label class="fld"><span>${todos}</span><select id="${id}"><option value="">Todos</option>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;

function agrupaPor(L,f,P){const m=new Map();L.forEach(r=>{const k=f(r);const g=m.get(k)||{k,v:0,va:0,vl:0,n:0,top:null,tv:-1};g.v+=r.v;g.va+=r.vant||0;g.vl+=r.vly||0;if(r.v>0)g.n++;if(r.v>g.tv){g.tv=r.v;g.top=r.m}m.set(k,g)});
 const okA=temDados(P.ant.a,P.ant.b),okL=temDados(P.ly.a,P.ly.b);return [...m.values()].map(g=>({...g,dA:okA&&g.va?varp(g.v,g.va):null,dL:okL&&g.vl?varp(g.v,g.vl):null})).sort((a,b)=>b.v-a.v)}

 const o={v:(a,b)=>b.v-a.v,dA:(a,b)=>(b.dA??-1e9)-(a.dA??-1e9),abs:(a,b)=>(a.v-(a.vant||0))-(b.v-(b.vant||0)),p:(a,b)=>b.pm-a.pm}[PA.ord]||((a,b)=>b.v-a.v);

const GRUPOS=[['risco','Em risco','Grandes e caindo: olhar primeiro.','baixo'],['ancora','Âncoras','Grandes e estáveis ou crescendo.','ok'],['promissor','Promissores','Menores e crescendo rápido.','pr'],['novo','Novos','Primeiro voucher nos últimos 3 meses do período.',''],['parado','Pararam','Tinham uso no período anterior e zeraram.','lim'],['cadsem','Cadastrados sem uso','Ativos no cadastro, sem nenhum voucher no período.','lim']];
function classifica(L,P){const com=L.filter(r=>r.v>0).sort((a,b)=>b.v-a.v);const tot=com.reduce((t,r)=>t+r.v,0);let ac=0;const grande=new Set();com.forEach(r=>{if(ac<tot*.8){grande.add(r.m)}ac+=r.v});
 const ini3=mAdd(P.b,-2);const G={risco:[],ancora:[],promissor:[],novo:[],parado:[],cadsem:[]};
 L.forEach(r=>{if(r.v===0){if(r.vant>0)G.parado.push(r);else if(r.status==='Ativo'&&!Object.keys(PA.d.uso.get(r.m)||{}).some(k=>k>=mAdd(P.b,-5)&&PA.d.uso.get(r.m)[k].v>0))G.cadsem.push(r);return}
  if(r.prim>=ini3){G.novo.push(r);return}
  if(grande.has(r.m)){(r.dA!=null&&r.dA<=-15?G.risco:G.ancora).push(r);return}
  if(r.dA!=null&&r.dA>=30&&r.v>=20)G.promissor.push(r)});
 const vis=new Set([...PA.d.info.keys()]);PA.d.cad.filter(c=>c.status==='Ativo').forEach(c=>{const tem=[...PA.d.info.values()].some(i=>i.rows.includes(c));if(!tem&&!G.cadsem.some(x=>x.m===baseNome(c.parceiro)))G.cadsem.push({m:baseNome(c.parceiro),cat:catsDe(c.categoria)[0]||'—',local:grupoLocal(c.local),v:0,vant:0,semDados:true,modo:c.modo})});
 G.cadsem=[...new Map(G.cadsem.map(x=>[x.m,x])).values()];
 G.risco.sort((a,b)=>(a.v-a.vant)-(b.v-b.vant));G.ancora.sort((a,b)=>b.v-a.v);G.promissor.sort((a,b)=>b.dA-a.dA);G.novo.sort((a,b)=>b.v-a.v);G.parado.sort((a,b)=>b.vant-a.vant);G.cadsem.sort((a,b)=>a.cat.localeCompare(b.cat,'pt-BR')||a.m.localeCompare(b.m,'pt-BR'));return {G,grande}}
function quadChart(L,grande){const pts=L.filter(r=>r.v>0&&r.dA!=null);if(pts.length<3)return '';const W=1000,H=360,Lm=50,R=130,T0=16,B=36;
 const xs=pts.map(r=>Math.log10(r.v));const x0=Math.min(...xs),x1=Math.max(...xs);const yc=v=>Math.max(-100,Math.min(150,v));
 const x=v=>Lm+(Math.log10(v)-x0)/((x1-x0)||1)*(W-Lm-R),y=v=>T0+(1-(yc(v)+100)/250)*(H-T0-B);
 const lim=Math.min(...pts.filter(r=>grande.has(r.m)).map(r=>r.v));let g='';
 [-100,-50,0,50,100,150].forEach(v=>{g+=`<line x1="${Lm}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#b9a9b2':'var(--line)'}"/><text x="${Lm-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>0?'+':''}${v}%</text>`});
 [10,100,1000,10000].filter(v=>Math.log10(v)>=x0&&Math.log10(v)<=x1).forEach(v=>g+=`<text x="${x(v)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmt(v)} vouchers</text>`);
 if(isFinite(lim))g+=`<line x1="${x(lim)}" x2="${x(lim)}" y1="${T0}" y2="${H-B}" stroke="#b9a9b2" stroke-dasharray="4 4"/><text x="${x(lim)+6}" y="${T0+12}" font-size="11" fill="var(--muted)">grandes →</text>`;
 pts.forEach(r=>{const c=grande.has(r.m)?(r.dA<=-15?'#c0392b':'#2e7d4f'):(r.dA>=30&&r.v>=20?'#C65911':'#b9a9b2');const big=grande.has(r.m);
  g+=`<circle cx="${x(r.v).toFixed(1)}" cy="${y(r.dA).toFixed(1)}" r="${big?5.5:3.5}" fill="${c}" fill-opacity=".8"><title>${esc(r.m)}: ${fmt(r.v)} vouchers, ${sinalP(r.dA)} vs anterior</title></circle>`;
  if(big&&(Math.abs(r.dA)>=15||r.v>=lim*3))g+=`<text x="${x(r.v)+7}" y="${y(r.dA)+4}" font-size="10.5" fill="#404040">${esc(r.m.length>22?r.m.slice(0,21)+'…':r.m)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" class="td-svg" role="img" aria-label="Parceiros por tamanho e variação">${g}</svg>${legend([['#c0392b','Em risco'],['#2e7d4f','Âncoras'],['#C65911','Promissores'],['#b9a9b2','Demais']])}`}

async function lerListaParceiros(file){let linhas;
 if(/\.csv$/i.test(file.name)){const buf=await file.arrayBuffer();let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}
  linhas=Papa.parse(txt,{skipEmptyLines:true,delimiter:txt.split('\n')[0].includes(';')?';':','}).data}
 else{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',dense:true});linhas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
 const hi=linhas.slice(0,10).findIndex(r=>(r||[]).some(x=>normU(x)==='PARCEIRO'));if(hi<0)throw new Error('Não encontrei a coluna Parceiro.');
 const h=linhas[hi].map(normU);const c=f=>h.findIndex(f);
 const ix={parceiro:c(x=>x==='PARCEIRO'),promocao:c(x=>x.startsWith('PROMO')),contato:c(x=>x.startsWith('CONTATO')),responsavel:c(x=>x.startsWith('RESPONS')),gargalos:c(x=>x.includes('GARGALO')),modo:c(x=>x.startsWith('MODO')),local:c(x=>x==='LOCAL'),categoria:c(x=>x.startsWith('CATEGORIA')),subcategoria:c(x=>x.startsWith('SUBCATEGORIA')),descricao:c(x=>x.startsWith('DESCRI')),link:c(x=>x.startsWith('LINK')),premium:c(x=>x.startsWith('PREMIUM'))};
 if(ix.categoria<0)throw new Error('Não encontrei a coluna Categorias.');
 const out=[];let status='Ativo';for(let r=hi+1;r<linhas.length;r++){const L=(linhas[r]||[]).map(x=>conserta(String(x??'')).trim());const v=k=>ix[k]>=0?L[ix[k]]||'':'';
  if(!L.some(Boolean))continue;if(normU(v('parceiro')).startsWith('ENCERRADAS')){status='Encerrado ou pausado';continue}if(!v('parceiro'))continue;
  out.push({parceiro:v('parceiro'),promocao:v('promocao'),contato:v('contato'),responsavel:v('responsavel'),gargalos:v('gargalos'),modo:v('modo'),local:v('local'),categoria:v('categoria'),subcategoria:v('subcategoria'),descricao:v('descricao'),link:v('link'),premium:/^s/i.test(v('premium')),status})}
 if(!out.length)throw new Error('A lista não tem parceiros.');return out}

  try{const rows=await lerListaParceiros(f);const at=rows.filter(r=>r.status==='Ativo');const semCat=rows.filter(r=>!r.categoria).length;
   box.innerHTML=`<p class="hint" style="margin-top:10px"><b>${fmt(rows.length)}</b> benefícios, <b>${fmt(new Set(at.map(r=>baseNome(r.parceiro))).size)}</b> parceiros ativos, ${fmt(rows.length-at.length)} encerrados ou pausados${semCat?`, ${fmt(semCat)} sem categoria`:''}.</p><button class="btn" id="pa-upok" type="button">Substituir a lista</button> <span class="hint" id="pa-upm"></span>`;

 else if(area==='semanal')rotaSemanal(h);
 else if(area==='parceiros')rotaParceiros(h);
 else if(CLUBE_PAGES[h]){if(M.length){app.innerHTML=CLUBE_PAGES[h]();bindClube(h)}else app.innerHTML=shell(h,semDados())}
 else if(area==='glossario')app.innerHTML=glossario(h);
 else if(area)app.innerHTML=planned(h);
 else app.innerHTML=home();
 const glq=document.getElementById('glq');if(glq)glq.addEventListener('input',()=>{const t=glq.value.toLowerCase().trim();document.querySelectorAll('.gl dt,.gl dd').forEach(e=>e.hidden=t&&!e.dataset.q.includes(t))});
 const tgt=pending||(h.startsWith('glossario-')?'gg-'+h.split('-')[1]:null);pending=null;
 if(tgt){const el=document.getElementById(tgt);if(el){el.scrollIntoView({block:'center'});if(tgt.startsWith('g-'))el.style.color='var(--laranja-esc)';return}}
 window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ---------- balão do glossário (botão direito / toque longo) ---------- */
const pop=document.getElementById('pop');
function showPop(el,x,y){const g=GLX[el.dataset.term];if(!g)return;
 pop.innerHTML=`<button class="x" aria-label="Fechar">×</button><b>${g.n}</b>${g.d}<br><a href="#g-${el.dataset.term}">Ver no glossário →</a>`;
 pop.hidden=false;const r=pop.getBoundingClientRect();const vw=innerWidth,vh=innerHeight;
 pop.style.left=Math.max(8,Math.min(x,vw-r.width-8))+'px';pop.style.top=Math.max(8,Math.min(y+10,vh-r.height-8))+'px';
 pop.querySelector('.x').onclick=hidePop;pop.querySelector('a').onclick=hidePop}
function hidePop(){pop.hidden=true}
document.addEventListener('contextmenu',e=>{const el=e.target.closest('.t');if(!el)return;e.preventDefault();showPop(el,e.clientX,e.clientY)});
let lp;document.addEventListener('touchstart',e=>{const el=e.target.closest('.t');if(!el)return;const t=e.touches[0];lp=setTimeout(()=>showPop(el,t.clientX,t.clientY),500)},{passive:true});
['touchend','touchmove'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
document.addEventListener('click',e=>{if(!pop.hidden&&!pop.contains(e.target))hidePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePop()});

/* ---------- login e sessão ---------- */
const telaLogin=document.getElementById('login'), telaPortal=document.getElementById('portal');
const formLogin=document.getElementById('form-login'), msgLogin=document.getElementById('login-msg');
function mostrarLogin(msg){telaPortal.hidden=true;telaLogin.hidden=false;msgLogin.textContent=msg||'';msgLogin.hidden=!msg;
 const b=formLogin.querySelector('button');b.disabled=false;b.textContent='Entrar'}
async function carregarDados(silencioso){
 if(!silencioso)app.innerHTML='<div class="wrap"><p class="carregando">Carregando os números…</p></div>';
 const {data,error}=await sb.rpc('dados_portal');
 if(error)throw error;
 prepararDados(data);
 if(typeof PA!=='undefined')PA.d=null; // parceiros recarregam com os meses novos
 const at=document.getElementById('atualizado');
 at.textContent=M.length?`Dados até ${lab(LAST)}`:'Sem dados';
}
async function entrarNoPortal(sessao){
 telaLogin.hidden=true;telaPortal.hidden=false;
 document.getElementById('usuario').textContent=sessao.user?.email||'';
 try{await carregarDados();route()}
 catch(e){app.innerHTML=`<div class="wrap"><div class="note" style="margin-top:24px">Não foi possível carregar os dados: ${esc(e.message||e)}. Tente sair e entrar de novo.</div></div>`}
}
formLogin.addEventListener('submit',async e=>{e.preventDefault();
 const b=formLogin.querySelector('button');b.disabled=true;b.textContent='Entrando…';msgLogin.hidden=true;
 const email=formLogin.email.value.trim(), senha=formLogin.senha.value;
 const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
 if(error){mostrarLogin(/invalid/i.test(error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar: '+error.message);return}
 formLogin.senha.value='';entrarNoPortal(data.session)});
document.getElementById('sair').addEventListener('click',async()=>{await sb.auth.signOut();RAW=null;location.hash='';mostrarLogin()});
(async()=>{const {data}=await sb.auth.getSession();if(data.session)entrarNoPortal(data.session);else mostrarLogin()})();
</script>
